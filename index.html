<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bespoke - Multi-Vibe Storefront Router</title>
    <!-- Tailwind CSS for high-fidelity styling -->
    <script src="https://tailwindcss.com"></script>
    <!-- Lucide Icons for clean visuals -->
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Brand Title -->
                <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
                    <i data-lucide="refresh-cw" class="text-indigo-600 w-5 h-5"></i>
                    <span class="text-xl font-black tracking-widest text-gray-900">ROTATE.</span>
                </div>
                
                <!-- Refresh Notice -->
                <div class="hidden sm:flex items-center gap-2 text-xs font-semibold bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                    </span>
                    Refresh page to roll a new store theme!
                </div>

                <!-- Shopping Bag Toggle Button -->
                <button onclick="toggleCart()" class="relative p-2 text-gray-700 hover:text-indigo-600 transition">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span id="cart-count" class="absolute top-0 right-0 bg-indigo-600 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- DYNAMIC BANNER HEADER -->
    <header class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white py-14 px-4 text-center">
        <h1 class="text-3xl font-black sm:text-5xl tracking-tight">The Automated Concept Store</h1>
        <p id="store-subtitle" class="mt-3 text-sm font-medium tracking-wide text-indigo-300 bg-indigo-950/50 inline-block px-4 py-1.5 rounded-full border border-indigo-800/40">
            Selecting randomized data engine...
        </p>
    </header>

    <!-- PRODUCT CATALOG VIEW SECTION -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <!-- Interactive loading spinner -->
        <div id="loading" class="text-center py-20">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full mb-4"></div>
            <p class="text-gray-500 text-sm font-medium">Resolving randomized API schemas...</p>
        </div>

        <!-- Render Grid Layout -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Dynamic product cards populate here -->
        </div>
    </main>

    <!-- SHOPPING CART SLIDEOUT DRAWER -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute inset-0 bg-gray-900 bg-opacity-40 transition-opacity" onclick="toggleCart()"></div>
            <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
                <div class="pointer-events-auto w-screen max-w-md bg-white flex flex-col shadow-2xl">
                    <div class="px-5 py-5 border-b border-gray-100 flex items-center justify-between">
                        <h2 class="font-bold text-gray-900 flex items-center gap-2"><i data-lucide="shopping-bag" class="w-4 h-4 text-indigo-600"></i> Your Bag</h2>
                        <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-5" id="cart-items">
                        <!-- Items render dynamically here -->
                    </div>

                    <div class="border-t border-gray-100 p-5 bg-gray-50">
                        <div class="flex justify-between text-sm font-bold text-gray-900">
                            <p>Subtotal</p>
                            <p id="cart-total">$0.00</p>
                        </div>
                        <button onclick="checkout()" class="w-full mt-4 bg-indigo-600 text-sm font-semibold text-white py-3 rounded-xl hover:bg-indigo-700 shadow-sm transition">
                            Complete Purchase
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-100 py-6 text-center text-xs text-gray-400 font-medium">
        <p>&copy; 2026 Dynamic Rotation Core. Built for live deployment.</p>
    </footer>

    <!-- EXTERNAL LOGIC CALL -->
    <script src="app.js"></script>
</body>
</html>
